steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - admin/Dockerfile
      - --build-arg
      - VITE_ADMIN_API_BASE_URL=/
      - -t
      - asia-east1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/$_IMAGE_NAME:$_TAG
      - .
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - asia-east1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/$_IMAGE_NAME:$_TAG
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - $_SERVICE_NAME
      - --image
      - asia-east1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/$_IMAGE_NAME:$_TAG
      - --region
      - $_REGION
      - --platform
      - managed
      - --allow-unauthenticated
      - --port
      - '8080'
      - --cpu
      - '1'
      - --memory
      - 512Mi
      - --concurrency
      - '40'
      - --timeout
      - '120'
      - --min-instances
      - '0'
      - --max-instances
      - '2'
      - --add-cloudsql-instances
      - $_CLOUD_SQL_INSTANCE
      - --set-env-vars
      - APP_ENV=production,DATABASE_URL=$_DATABASE_URL,JWT_SECRET_KEY=$_JWT_SECRET_KEY,ADMIN_INIT_USERNAME=$_ADMIN_INIT_USERNAME,ADMIN_INIT_PASSWORD=$_ADMIN_INIT_PASSWORD,MAIN_SITE_URL=$_MAIN_SITE_URL,TRYON_WORKBENCH_URL=$_TRYON_WORKBENCH_URL,GCS_BUCKET_NAME=$_GCS_BUCKET_NAME,PUBLIC_IMAGE_BASE_URL=$_PUBLIC_IMAGE_BASE_URL,CORS_ALLOW_ORIGINS=$_CORS_ALLOW_ORIGINS,GEMINI_API_KEY=$_GEMINI_API_KEY,INGEST_SECRET_KEY=$_INGEST_SECRET_KEY,FERNET_SECRET_KEY=$_FERNET_SECRET_KEY
images:
  - asia-east1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/$_IMAGE_NAME:$_TAG
