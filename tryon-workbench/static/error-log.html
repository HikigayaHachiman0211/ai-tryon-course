<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统错误日志 | 模特试衣</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #080b16 0%, #130b26 50%, #0e162a 100%);
            color: #fff;
            min-height: 100vh;
        }
        .container { max-width: 980px; margin: 0 auto; padding: 20px 14px; }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 16px;
        }
        .title { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 700; }
        .title i { color: #ef4444; }
        .badge {
            background: #ef4444;
            color: #fff;
            border-radius: 999px;
            padding: 2px 8px;
            font-size: 12px;
            font-weight: 700;
        }
        .actions { display: flex; gap: 8px; flex-wrap: wrap; }
        .btn {
            border: 1px solid rgba(255, 255, 255, 0.14);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            border-radius: 10px;
            padding: 8px 12px;
            cursor: pointer;
            font-size: 13px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
        }
        .btn:hover { background: rgba(255, 255, 255, 0.1); }
        .btn-danger { border-color: rgba(239, 68, 68, 0.35); color: #f87171; }
        .list { display: flex; flex-direction: column; gap: 10px; }
        .empty {
            text-align: center;
            padding: 60px 10px;
            color: rgba(255, 255, 255, 0.45);
        }
        .card {
            background: rgba(239, 68, 68, 0.06);
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: 12px;
            padding: 12px;
        }
        .meta { font-size: 12px; color: rgba(255, 255, 255, 0.55); margin-bottom: 6px; }
        .msg { font-size: 13px; line-height: 1.55; color: rgba(255, 255, 255, 0.9); word-break: break-word; }
        .analysis {
            margin-top: 8px;
            padding: 8px 10px;
            border: 1px solid rgba(59, 130, 246, 0.25);
            border-radius: 8px;
            background: rgba(59, 130, 246, 0.08);
            color: #bfdbfe;
            white-space: pre-wrap;
            line-height: 1.5;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="title">
                <i class="fas fa-bug"></i>
                <span>系统错误日志</span>
                <span id="total" class="badge">0</span>
            </div>
            <div class="actions">
                <a href="/static/index.html" class="btn"><i class="fas fa-arrow-left"></i> 返回主页</a>
                <button id="refresh" class="btn"><i class="fas fa-sync-alt"></i> 刷新</button>
                <button id="clear" class="btn btn-danger"><i class="fas fa-trash-alt"></i> 清空</button>
            </div>
        </div>
        <div id="list" class="list"></div>
    </div>
    <script>
        const listEl = document.getElementById('list');
        const totalEl = document.getElementById('total');

        function esc(text) {
            return String(text || '')
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#39;');
        }

        async function load() {
            try {
                const resp = await fetch('/api/errors', { cache: 'no-store' });
                const data = await resp.json();
                const errors = Array.isArray(data.errors) ? data.errors : [];
                totalEl.textContent = String(errors.length);
                if (errors.length === 0) {
                    listEl.innerHTML = '<div class="empty"><i class="fas fa-check-circle"></i><p>暂无错误记录</p></div>';
                    return;
                }
                listEl.innerHTML = errors.map(e => `
                    <div class="card">
                        <div class="meta">${esc(e.time || '')}${e.context ? ` · ${esc(e.context)}` : ''}</div>
                        <div class="msg">${esc(e.message || '')}</div>
                        ${e.detail ? `<div class="msg" style="margin-top:6px;color:rgba(255,255,255,0.7)">${esc(e.detail)}</div>` : ''}
                        ${e.analysis ? `<div class="analysis"><i class="fas fa-robot"></i> ${esc(e.analysis)}</div>` : ''}
                    </div>
                `).join('');
            } catch (err) {
                listEl.innerHTML = `<div class="empty"><i class="fas fa-exclamation-triangle"></i><p>加载失败：${esc(err.message)}</p></div>`;
            }
        }

        document.getElementById('refresh').addEventListener('click', load);
        document.getElementById('clear').addEventListener('click', async () => {
            await fetch('/api/errors', { method: 'DELETE' });
            load();
        });

        load();
        setInterval(load, 5000);
    </script>
</body>
</html>
